name: Build and deploy BYSHO

concurrency:
  group: bysho-production-deploy
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --force

      - name: Build production site
        run: npm run build

      - name: Publish dist to gh-pages
        run: |
          cp -r dist /tmp/bysho-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . || true
          cp -r /tmp/bysho-dist/. .
          # Keep aliases for entry bundles that may still be referenced by cached Porkbun HTML.
          ENTRY=$(find assets -maxdepth 1 -type f -name 'index-*.js' | head -n 1)
          if [ -n "$ENTRY" ]; then
            cp "$ENTRY" assets/index-BjWEWmeb.js
            cp "$ENTRY" assets/index-BI5rdQLl.js
            cp "$ENTRY" assets/index-Bltug6K2.js
          fi
          touch .nojekyll
          git add -A
          git commit -m "Deploy BYSHO production build"
          git push origin gh-pages --force
