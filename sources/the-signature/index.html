<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101012">
    <meta name="description" content="The Signature — a dedicated BYSHO experience.">
    <title>The Signature — BYSHO</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #101012;
            color: #f5f4f0;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
        }
        main { width: min(100%, 64rem); }
        p { margin: 0; }
        .eyebrow {
            margin-bottom: 1.5rem;
            color: #aaa7a2;
            font-size: .75rem;
            letter-spacing: .18em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            font-size: clamp(3rem, 9vw, 7.5rem);
            font-weight: 500;
            letter-spacing: -.065em;
            line-height: .96;
        }
        .note {
            margin-top: 2rem;
            color: #aaa7a2;
            font-size: .95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">BYSHO / THE SIGNATURE</p>
        <h1>The Signature</h1>
        <p class="note">This page is reserved for Sho's design direction. The full experience comes next.</p>
    </main>
</body>
</html>
